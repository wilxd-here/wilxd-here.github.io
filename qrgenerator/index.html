<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xaerisoft Code Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           CSS: PREMIUM UNIVERSE & GLOW EFFECTS 
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #050505;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden; 
            overflow-y: auto;
            padding: 40px 0;
            position: relative;
        }

        /* --- Background Luar Angkasa --- */
        #universe-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        }

        .stars {
            width: 1px; height: 1px;
            background: transparent;
            box-shadow: 174px 123px #FFF, 345px 567px #FFF, 890px 345px #FFF, 123px 890px #FFF, 543px 234px #FFF, 987px 654px #FFF;
            animation: animStar 50s linear infinite;
        }
        .stars::after {
            content: " "; position: absolute; top: 2000px;
            width: 1px; height: 1px; background: transparent;
            box-shadow: 174px 123px #FFF, 345px 567px #FFF, 890px 345px #FFF, 123px 890px #FFF;
        }
        @keyframes animStar {
            from { transform: translateY(0px); }
            to { transform: translateY(-2000px); }
        }

        /* Efek Nebula (Cahaya di background) */
        .nebula {
            position: absolute;
            width: 300px; height: 300px;
            background: #00d2ff;
            filter: blur(150px);
            opacity: 0.2;
            top: 10%; left: 20%;
            border-radius: 50%;
            animation: pulseNebula 8s infinite alternate;
        }
        @keyframes pulseNebula {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.5); opacity: 0.4; }
        }

        /* --- Glassmorphism Card (Dengan efek Float) --- */
        .glass-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 1;
            animation: floatCard 6s ease-in-out infinite;
        }
        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header i {
            color: #00d2ff;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 13px;
            color: #b0b0b0;
            margin-top: 5px;
        }

        /* --- UI Label & Separator --- */
        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .separator {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            margin: 35px 0;
        }

        /* --- Universal Input --- */
        .input-group {
            margin-bottom: 20px;
        }
        textarea, input.form-control {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        textarea {
            resize: none;
        }
        textarea:focus, input.form-control:focus {
            border-color: #00d2ff;
            background: rgba(0,0,0,0.6);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), 0 0 15px rgba(0, 210, 255, 0.3);
        }
        textarea::placeholder, input.form-control::placeholder {
            color: #777;
        }

        /* --- Buttons --- */
        button {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3);
            margin-bottom: 12px;
        }
        .btn-gradient:hover {
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.5);
            transform: translateY(-2px);
        }
        .btn-gradient:active {
            transform: translateY(1px);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #ccc;
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        /* --- QR / Barcode Box Preview (Dengan efek Glow) --- */
        .qr-wrapper {
            background: white;
            padding: 25px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 25px;
            display: none; 
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        #qr-result, #barcode-result {
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            width: 100%;
        }
        #qr-result img, #qr-result canvas, #barcode-result canvas {
            max-width: 100%;
            height: auto;
        }
        .btn-download {
            background: #0f2027;
            color: white;
            margin-top: 20px;
            width: 100%;
            box-shadow: none;
        }
        .btn-download:hover {
            background: #203a43;
        }

        /* --- Toast Error/Success --- */
        #toast {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 71, 87, 0.9);
            backdrop-filter: blur(5px);
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 100;
        }
        #toast.show {
            opacity: 1;
            visibility: visible;
            bottom: 40px;
        }
        #toast.success {
            background: rgba(46, 213, 115, 0.9);
            box-shadow: 0 10px 25px rgba(46, 213, 115, 0.4);
        }
    </style>
</head>
<body>

    <div id="universe-bg">
        <div class="stars"></div>
        <div class="nebula"></div>
    </div>

    <div id="toast">Notifikasi di sini</div>

    <div class="glass-container">
        <!-- HEADER DIUPGRADE -->
        <div class="header">
            <i class="fa-solid fa-qrcode fa-2x"></i>
            <i class="fa-solid fa-barcode fa-2x" style="margin-left: 8px;"></i>
            <h1>Xaerisoft Code</h1>
            <p>Fast QR & Barcode Generator</p>
        </div>

        <!-- ============================================== -->
        <!-- SECTION 1: QR GENERATOR (KODE LAMA DIPERTAHANKAN) -->
        <!-- ============================================== -->
        <div class="section-label">
            <i class="fa-solid fa-qrcode"></i> QR Generator
        </div>

        <div class="input-group">
            <textarea id="qr-input" rows="4" placeholder="Ketik apa saja di sini...&#10;(Link web, Teks panjang, Nomor HP, dll)"></textarea>
        </div>

        <button id="btn-generate" class="btn-gradient">Generate QR Code <i class="fa-solid fa-wand-magic-sparkles"></i></button>
        <button id="btn-reset" class="btn-outline">Reset Form <i class="fa-solid fa-rotate-right"></i></button>

        <div class="qr-wrapper" id="qr-wrapper">
            <div id="qr-result"></div>
            <button id="btn-dl-png" class="btn-download">Simpan Gambar <i class="fa-solid fa-download"></i></button>
        </div>

        <!-- ============================================== -->
        <!-- SEPARATOR (PEMISAH SECTION) -->
        <!-- ============================================== -->
        <hr class="separator">

        <!-- ============================================== -->
        <!-- SECTION 2: BARCODE GENERATOR (KUSUS CODE 93) -->
        <!-- ============================================== -->
        <div class="section-label">
            <i class="fa-solid fa-barcode"></i> Barcode Generator
        </div>

        <div class="input-group">
            <input type="text" id="barcode-input" class="form-control" placeholder="Masukkan teks/angka barcode..." style="margin-bottom: 12px;">
            
            <!-- Indikator bahwa format sudah dikunci ke CODE 93 -->
            <div style="font-size: 13px; color: #00d2ff; display: flex; align-items: center; gap: 8px; justify-content: center; background: rgba(0, 210, 255, 0.1); padding: 8px; border-radius: 8px;">
                <i class="fa-solid fa-lock" style="font-size: 12px;"></i> Format Terkunci: <strong>CODE 93</strong>
            </div>
        </div>

        <button id="btn-generate-barcode" class="btn-gradient">Generate Barcode <i class="fa-solid fa-wand-magic-sparkles"></i></button>
        <button id="btn-reset-barcode" class="btn-outline">Reset Barcode <i class="fa-solid fa-rotate-right"></i></button>

        <div class="qr-wrapper" id="barcode-wrapper">
            <div id="barcode-result">
                <canvas id="barcode-canvas"></canvas>
            </div>
            <button id="btn-dl-barcode" class="btn-download">Simpan Barcode <i class="fa-solid fa-download"></i></button>
        </div>
    </div>

    <!-- LIBRARY JAVASCRIPT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Ganti JsBarcode dengan bwip-js untuk support Native CODE 93 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bwip-js/3.4.2/bwip-js-min.js"></script>

    <script>
        // ==========================================
        // 1. SCRIPT QR GENERATOR (TIDAK DIUBAH SAMA SEKALI)
        // ==========================================
        const qrInput = document.getElementById("qr-input");
        const btnGenerate = document.getElementById("btn-generate");
        const btnReset = document.getElementById("btn-reset");
        const qrWrapper = document.getElementById("qr-wrapper");
        const qrResult = document.getElementById("qr-result");
        const btnDlPng = document.getElementById("btn-dl-png");
        const toast = document.getElementById("toast");

        function showToast(msg, isSuccess = false) {
            toast.innerText = msg;
            toast.className = isSuccess ? "show success" : "show";
            setTimeout(() => {
                toast.className = toast.className.replace("show", "").trim();
            }, 3000);
        }

        qrInput.addEventListener("input", () => {
            if (qrWrapper.style.display === "flex") {
                qrWrapper.style.display = "none";
            }
        });

        btnGenerate.addEventListener("click", () => {
            const data = qrInput.value.trim();

            if (!data) {
                showToast("⚠️ Bro, isi teksnya dulu ya!");
                qrInput.style.transform = "translateX(-5px)";
                setTimeout(() => qrInput.style.transform = "translateX(5px)", 50);
                setTimeout(() => qrInput.style.transform = "translateX(0)", 100);
                return;
            }

            qrResult.innerHTML = "";
            qrWrapper.style.display = "flex";

            new QRCode(qrResult, {
                text: data,
                width: 220,
                height: 220,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            showToast("✨ QR Code Berhasil Dibuat!", true);
        });

        btnReset.addEventListener("click", () => {
            qrInput.value = "";
            qrWrapper.style.display = "none";
            showToast("🔄 Form dibersihkan", true);
        });

        btnDlPng.addEventListener('click', () => {
            const canvas = qrResult.querySelector('canvas');
            if (canvas) {
                const url = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.href = url;
                link.download = 'Xaerisoft-Universal-QR.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("📥 Berhasil didownload ke HP lu!", true);
            }
        });

        // ==========================================
        // 2. SCRIPT BARCODE GENERATOR (HANYA CODE 93)
        // ==========================================
        const barcodeInput = document.getElementById("barcode-input");
        const btnGenerateBarcode = document.getElementById("btn-generate-barcode");
        const btnResetBarcode = document.getElementById("btn-reset-barcode");
        const barcodeWrapper = document.getElementById("barcode-wrapper");
        const barcodeCanvas = document.getElementById("barcode-canvas");
        const btnDlBarcode = document.getElementById("btn-dl-barcode");

        // Fitur Auto Preview Barcode
        barcodeInput.addEventListener("input", () => {
            if (barcodeInput.value.trim() !== "") {
                generateBarcode(true); 
            } else {
                barcodeWrapper.style.display = "none";
            }
        });

        // Main Generate Function
        function generateBarcode(isAuto = false) {
            const data = barcodeInput.value.trim();

            if (!data) {
                if (!isAuto) {
                    showToast("⚠️ Bro, isi teks/angka barcode-nya dulu ya!");
                    barcodeInput.style.transform = "translateX(-5px)";
                    setTimeout(() => barcodeInput.style.transform = "translateX(5px)", 50);
                    setTimeout(() => barcodeInput.style.transform = "translateX(0)", 100);
                }
                return;
            }

            try {
                // Generate Barcode spesifik CODE 93 menggunakan bwip-js
                bwipjs.toCanvas('barcode-canvas', {
                    bcid: 'code93',       // Dikunci hanya untuk Code 93
                    text: data,           // Data Input
                    scale: 2,             // Skala ukuran
                    height: 15,           // Tinggi Barcode
                    includetext: true,    // Tampilkan teks di bawah barcode
                    textxalign: 'center', // Align teks di tengah
                    backgroundcolor: 'ffffff', // Background putih
                    padding: 5
                });
                
                barcodeWrapper.style.display = "flex";
                if (!isAuto) showToast("✨ Barcode CODE 93 Berhasil Dibuat!", true);
                
            } catch (error) {
                if (!isAuto) {
                    showToast("⚠️ Ada karakter yang tidak didukung oleh format CODE 93!", false);
                    barcodeInput.style.transform = "translateX(-5px)";
                    setTimeout(() => barcodeInput.style.transform = "translateX(5px)", 50);
                    setTimeout(() => barcodeInput.style.transform = "translateX(0)", 100);
                } else {
                    barcodeWrapper.style.display = "none"; 
                }
            }
        }

        // Tombol Generate Manual Barcode
        btnGenerateBarcode.addEventListener("click", () => generateBarcode(false));

        // Tombol Reset Barcode
        btnResetBarcode.addEventListener("click", () => {
            barcodeInput.value = "";
            barcodeWrapper.style.display = "none";
            showToast("🔄 Form Barcode dibersihkan", true);
        });

        // Download Barcode CODE 93
        btnDlBarcode.addEventListener('click', () => {
            const url = barcodeCanvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.href = url;
            link.download = `Xaerisoft-CODE93-Barcode.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("📥 Barcode berhasil didownload ke HP lu!", true);
        });
    </script>
</body>
</html>
