<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAERISOFT — System Upgrade & Maintenance</title>
  
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       RESET & BASE STYLES
       ========================================================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      user-select: none;
    }

    :root {
      --primary-cyan: #00d2ff;
      --secondary-blue: #3a7bd5;
      --bg-dark-card: #101828;
      --bg-deep-space: #050505;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(0, 210, 255, 0.22);
      --glass-glow: rgba(0, 210, 255, 0.15);
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden; /* Menjamin tidak ada scrollbar */
      background-color: var(--bg-deep-space);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* ==========================================================================
       CANVAS & AURORA BACKGROUND
       ========================================================================== */
    #space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .aurora-container {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      filter: blur(90px);
      opacity: 0.65;
      pointer-events: none;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      animation: floatAurora 16s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 55vw;
      height: 55vw;
      max-width: 600px;
      max-height: 600px;
      background: radial-gradient(circle, var(--primary-cyan) 0%, rgba(0, 210, 255, 0) 70%);
      top: -15%;
      left: 10%;
    }

    .blob-2 {
      width: 60vw;
      height: 60vw;
      max-width: 650px;
      max-height: 650px;
      background: radial-gradient(circle, var(--secondary-blue) 0%, rgba(58, 123, 213, 0) 70%);
      bottom: -20%;
      right: 5%;
      animation-delay: -8s;
    }

    .blob-3 {
      width: 45vw;
      height: 45vw;
      max-width: 500px;
      max-height: 500px;
      background: radial-gradient(circle, rgba(16, 24, 40, 0.9) 0%, rgba(0, 210, 255, 0.25) 70%);
      top: 35%;
      left: 30%;
      animation-duration: 22s;
    }

    @keyframes floatAurora {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.08); }
      100% { transform: translate(-30px, 40px) scale(0.95); }
    }

    /* ==========================================================================
       MAIN GLASS CARD & PARALLAX WRAPPER
       ========================================================================== */
    .viewport-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      perspective: 1000px;
    }

    .glass-card {
      position: relative;
      width: 100%;
      max-width: 760px;
      padding: 2.5rem 3rem;
      background: rgba(16, 24, 40, 0.45);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.7),
        0 0 80px var(--glass-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;
      animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Scanline effect halus */
    .glass-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 28px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.03) 0%,
        rgba(255, 255, 255, 0) 100%
      );
      pointer-events: none;
    }

    /* ==========================================================================
       META TOP BAR (Clock & Date)
       ========================================================================== */
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    /* ==========================================================================
       BRAND & STATUS BADGE
       ========================================================================== */
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.25rem;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--secondary-blue));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    .logo-icon svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .brand-name {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      background: linear-gradient(135deg, #ffffff 30%, var(--primary-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 210, 255, 0.08);
      border: 1px solid rgba(0, 210, 255, 0.2);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 500;
      color: #00ffaa;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(10px);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #00ffaa;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ffaa;
      animation: pulseDot 1.8s infinite;
    }

    @keyframes pulseDot {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 170, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 255, 170, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 170, 0); }
    }

    /* ==========================================================================
       TYPOGRAPHY CONTENT
       ========================================================================== */
    .main-title {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.82) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .main-description {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 580px;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    /* ==========================================================================
       PROGRESS BAR SECTION
       ========================================================================== */
    .progress-container {
      width: 100%;
      max-width: 580px;
      margin-bottom: 2.2rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .progress-value {
      color: var(--primary-cyan);
      font-weight: 700;
      font-family: monospace;
      font-size: 0.95rem;
    }

    .progress-track {
      position: relative;
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--secondary-blue) 0%, var(--primary-cyan) 100%);
      border-radius: 8px;
      box-shadow: 0 0 15px var(--primary-cyan);
      transition: width 0.4s cubic-bezier(0.1, 0.8, 0.3, 1);
      position: relative;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    /* ==========================================================================
       ACTION BUTTONS
       ========================================================================== */
    .button-group {
      display: flex;
      gap: 16px;
      width: 100%;
      justify-content: center;
      margin-bottom: 1.8rem;
    }

    .btn {
      position: relative;
      padding: 0.75rem 1.8rem;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-cyan), var(--secondary-blue));
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 210, 255, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0, 210, 255, 0.5);
      filter: brightness(1.1);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      background: rgba(0, 210, 255, 0.12);
      border-color: rgba(0, 210, 255, 0.4);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      transition: transform 0.4s ease;
    }

    .btn-primary:hover svg {
      transform: rotate(180deg);
    }

    /* ==========================================================================
       FOOTER
       ========================================================================== */
    .footer-text {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.03em;
    }

    /* ==========================================================================
       MODAL POPUP (Server Status Detail)
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 5, 0.75);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 90%;
      max-width: 440px;
      background: rgba(16, 24, 40, 0.85);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.8rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px var(--glass-glow);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-cyan);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .status-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.85rem;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .status-item span:first-child {
      color: var(--text-muted);
    }

    .status-item span:last-child {
      color: #00ffaa;
      font-weight: 600;
    }

    /* ==========================================================================
       RESPONSIVE DESIGN (TETAP TANPA SCROLL)
       ========================================================================== */
    @media (max-width: 640px) {
      .glass-card {
        padding: 1.8rem 1.5rem;
        border-radius: 22px;
      }

      .brand-name {
        font-size: 1.4rem;
      }

      .main-title {
        font-size: 1.6rem;
      }

      .main-description {
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
      }

      .button-group {
        flex-direction: column;
        gap: 10px;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }

      .meta-bar {
        font-size: 0.7rem;
        margin-bottom: 1.2rem;
      }
    }

    @media (max-height: 700px) {
      .glass-card {
        padding: 1.4rem 2rem;
      }
      .main-title {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      .main-description {
        margin-bottom: 1.2rem;
      }
      .progress-container {
        margin-bottom: 1.2rem;
      }
      .brand-logo {
        margin-bottom: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- STARFIELD CANVAS -->

      <!-- META HEADER BAR (Tanpa Versi) -->

  <!-- ==========================================================================
     JAVASCRIPT (PURE VANILLA)
     ========================================================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
  /* ==========================================================================
         1. SPACE CANVAS (STARS & FLOATING PARTICLES)
         ========================================================================== */
      const canvas = document.getElementById('space-canvas');
      const ctx = canvas.getContext('2d');

      let width, height;
      let stars = [];
      const STAR_COUNT = 140;

      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      class Star {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 1.8 + 0.2;
          this.alpha = Math.random() * 0.8 + 0.2;
          this.alphaSpeed = Math.random() * 0.015 + 0.005;
          this.vx = (Math.random() - 0.5) * 0.2;
          this.vy = (Math.random() - 0.5) * 0.2;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
            this.reset();
          }

          this.alpha += this.alphaSpeed;
          if (this.alpha > 1 || this.alpha < 0.2) {
            this.alphaSpeed = -this.alphaSpeed;
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 210, 255, ${this.alpha})`;
          ctx.shadowBlur = this.size > 1.2 ? 8 : 0;
          ctx.shadowColor = '#00d2ff';
          ctx.fill();
        }
      }

      function initStars() {
        resizeCanvas();
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push(new Star());
        }
      }

      function animateStars() {
        ctx.clearRect(0, 0, width, height);
        stars.forEach(star => {
          star.update();
          star.draw();
        });
        requestAnimationFrame(animateStars);
      }

      window.addEventListener('resize', resizeCanvas);
      initStars();
      animateStars();


      /* ==========================================================================
         2. LIVE CLOCK & DATE
         ========================================================================== */
      const clockElem = document.getElementById('live-clock');
      const dateElem = document.getElementById('live-date');

      function updateClock() {
        const now = new Date();

        // Time (UTC)
        const hours = String(now.getUTCHours()).padStart(2, '0');
        const minutes = String(now.getUTCMinutes()).padStart(2, '0');
        const seconds = String(now.getUTCSeconds()).padStart(2, '0');
        clockElem.textContent = `${hours}:${minutes}:${seconds}`;

        // Date
        const options = { day: '2-digit', month: 'SHORT', year: 'NUMERIC' };
        dateElem.textContent = now.toLocaleDateString('en-US', options).toUpperCase();
      }

      setInterval(updateClock, 1000);
      updateClock();


      /* ==========================================================================
         3. ANIMATED PROGRESS BAR (TARGET 82%)
         ========================================================================== */
      const progressFill = document.getElementById('progress-fill');
      const progressText = document.getElementById('progress-text');
      
      let currentProgress = 0;
      const targetProgress = 82; // Sesuai contoh pada prompt

      function animateProgressBar() {
        if (currentProgress < targetProgress) {
          currentProgress += Math.random() * 1.5 + 0.5;
          if (currentProgress > targetProgress) currentProgress = targetProgress;
          
          progressFill.style.width = `${currentProgress}%`;
          progressText.textContent = `${Math.floor(currentProgress)}%`;

          setTimeout(animateProgressBar, 40);
        } else {
          // Micro animation pulsation setelah mencapai 82%
          setInterval(() => {
            const jitter = 82 + (Math.random() * 0.8 - 0.4);
            progressFill.style.width = `${jitter}%`;
          }, 1500);
        }
      }

      setTimeout(animateProgressBar, 600);


      /* ==========================================================================
         4. MOUSE PARALLAX EFFECT
         ========================================================================== */
      const card = document.getElementById('card');

      document.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 45;

        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      });

      document.addEventListener('mouseleave', () => {
        card.style.transform = `rotateY(0deg) rotateX(0deg)`;
      });


      /* ==========================================================================
         5. BUTTON ACTIONS & MODAL
         ========================================================================== */
      const btnRefresh = document.getElementById('btn-refresh');
      const btnStatus = document.getElementById('btn-status');
      const statusModal = document.getElementById('status-modal');
      const modalClose = document.getElementById('modal-close');

      // Refresh button effect
      btnRefresh.addEventListener('click', () => {
        btnRefresh.style.pointerEvents = 'none';
        btnRefresh.innerHTML = `
          <svg style="animation: spin 1s linear infinite;" viewBox="0 0 24 24">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
          Re-checking...
        `;

        setTimeout(() => {
          window.location.reload();
        }, 1200);
      });

      // Modal Toggle
      btnStatus.addEventListener('click', () => {
        statusModal.classList.add('active');
      });

      modalClose.addEventListener('click', () => {
        statusModal.classList.remove('active');
      });

      statusModal.addEventListener('click', (e) => {
        if (e.target === statusModal) {
          statusModal.classList.remove('active');
        }
      });

    });
  </script>

  <!-- Keyframe Spin untuk Tombol Reload -->
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

</body>
</html>
